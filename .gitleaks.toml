# Gitleaks configuration for Kepler.
#
# Keep the default rule set active. Add allowlist entries only for documented,
# non-secret placeholders that are safe to publish.

[extend]
useDefault = true

[[allowlists]]
description = "Known synthetic test key; not a credential"
regexes = [
  '''SECRET-KEY-abc123def456''',
]

[[allowlists]]
description = "Documented environment variable names, not credential values"
regexes = [
  '''ADS_DEV_KEY''',
  '''ANTHROPIC_API_KEY''',
  '''NASA_API_KEY''',
]
paths = [
  '''README\.md''',
  '''CONTRIBUTING\.md''',
  '''kepler/runner\.py''',
  '''kepler/tools/ads\.py''',
  '''docs/.*\.md''',
  '''\.github/workflows/.*\.yml''',
]
