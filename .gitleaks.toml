# Gitleaks configuration for Kepler.
#
# Keep the default rule set active. Add allowlist entries only for documented,
# non-secret placeholders that are safe to publish.

[extend]
useDefault = true

[[allowlists]]
description = "Known synthetic test key; not a credential"
regexes = [
  '''SECRET-KEY-abc123def456''',
]

[[allowlists]]
description = "Documented environment variable names, not credential values"
# This allowlist is deliberately PATH-SCOPED, and every entry is an exact
# file -- never a directory wildcard. A gitleaks `paths` allowlist suppresses
# every finding in a matching file, so a pattern like `docs/.*\.md` would turn
# off secret detection for a whole tree and hide a genuinely leaked value
# pasted into any doc -- the one thing this scan exists to catch. The
# `regexes` below record which variable *names* these files are allowed to
# spell out (often in a `KEY=... <command>` usage example); the value of a
# real key never matches them. Add a path here only when a new reviewed file
# needs to name one of these variables, and keep it as specific as these are.
regexes = [
  '''ADS_DEV_KEY''',
  '''ANTHROPIC_API_KEY''',
  '''NASA_API_KEY''',
  '''OPENAI_API_KEY''',
  '''GEMINI_API_KEY''',
]
paths = [
  '''AGENTS\.md''',
  '''CLAUDE\.md''',
  '''README\.md''',
  '''docs/analysis/applicable-designs\.md''',
  '''docs/examples/README\.md''',
  '''docs/archive/model-backends\.md''',
  '''tests/test_agent_session_manifest\.py''',
  '''tools/ads\.py''',
  '''tools/registry\.py''',
  # OPENAI_API_KEY: the model port, added in Phase 2a with its first uses.
  '''tests/test_llm_factory\.py''',
  '''tests/test_llm_openai_backend\.py''',
  '''tools/llm/factory\.py''',
  '''tools/llm/openai_backend\.py''',
  # GEMINI_API_KEY: added in Phase 3 with its first uses.
  '''tests/test_llm_gemini_backend\.py''',
  '''tools/llm/gemini_backend\.py''',
  # The benchmark harness's capture-time credential scan (S2) and its tests
  # name every variable above, because the scan's whole job is to keep their
  # *values* out of a recorded fixture. Added in benchmark phase 4d with its
  # first uses. Exact files, as every entry here is.
  '''tools/bench/record\.py''',
  '''tests/test_bench_record\.py''',
  # These four name a variable only to say what a task may NOT set (B7), what
  # a capture still needs, or what the calibration run would need. Same rule:
  # exact files, never a directory wildcard over benchmarks/ or docs/.
  '''tools/bench/tasks\.py''',
  '''tests/test_bench_tasks\.py''',
  '''benchmarks/fixtures/search_ads\.yaml''',
  '''benchmarks/fixtures/get_paper_abstract\.yaml''',
  '''docs/benchmarking/harness\.md''',
  # The console's backend selection: the .env reader that puts the key into the
  # environment (moved from tools/config.py to tools/dotenv.py so an entry
  # point can load it before any setting is read), the choice table that names
  # the variable each provider reads, and their tests. Added with the TUI's
  # /backend command. Exact files, as every entry here is.
  '''tools/dotenv\.py''',
  '''tools/tui/backends\.py''',
  '''tests/test_tui_backends\.py''',
  '''tests/test_tui_app\.py''',
  # The other model adapters, the agent's system prompt, and the recorded
  # schema translations: each names the variable its provider reads, or tells
  # the model a key is the user's own. Listed when a second review of the MCP
  # track found them missing; each has named one since the model port.
  '''tools/agent/prompt\.py''',
  '''tools/llm/anthropic_backend\.py''',
  '''tools/llm/ollama_backend\.py''',
  '''tests/test_llm_anthropic_backend\.py''',
  '''tests/test_llm_ollama_backend\.py''',
  '''tests/fixtures/llm/schemas/anthropic\.json''',
  '''tests/fixtures/llm/schemas/gemini\.json''',
  '''tests/fixtures/llm/schemas/openai\.json''',
  '''tests/fixtures/llm/schemas/openai_strict\.json''',
  # The MCP server: the install facts say whether ADS_DEV_KEY is set (never
  # its value), the skill's database and checkout references tell a model and
  # a user which variable the ADS tools read, in its one source and its
  # rendered copy, and the install and architecture docs say the same.
  '''tools/mcp/install\.py''',
  '''tests/test_mcp_surface\.py''',
  '''tools/skill/source/references/checkout\.md''',
  '''tools/skill/source/references/databases\.md''',
  '''skills/kepler-tools/references/checkout\.md''',
  '''skills/kepler-tools/references/databases\.md''',
  '''docs/installing\.md''',
  '''docs/tool-architecture\.md''',
  '''docs/archive/mcp-tool-surface\.md''',
]
