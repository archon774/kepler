[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kepler"
version = "0.1.0"
description = "Early-stage astronomy tool collection and extracted algorithm modules."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ads==0.12.7",
    "annotated-types==0.8.0",
    "anthropic==0.121.0",
    "anyio==4.14.2",
    "appdirs==1.4.4",
    "astropy==8.0.1",
    "astropy-iers-data==0.2026.8.3.0.53.6",
    "astroquery==0.4.11",
    "beautifulsoup4==4.15.0",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.4.9",
    "contourpy==1.3.3",
    "cryptography==50.0.0",
    "cycler==0.12.1",
    "distro==1.9.0",
    "docstring-parser==0.18.0",
    "fonttools==4.63.0",
    "h11==0.16.0",
    "html5lib==1.1",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.18",
    "jaraco.classes==3.4.0",
    "jaraco.context==6.1.2",
    "jaraco.functools==4.6.0",
    "jeepney==0.9.0",
    "jiter==0.16.0",
    "keyring==25.7.0",
    "kiwisolver==1.5.0",
    "MarkupSafe==3.0.3",
    "matplotlib==3.11.1",
    "mock==5.2.0",
    "more-itertools==11.1.0",
    "numba==0.66.0",
    "numpy==2.4.6",
    "packaging==26.3",
    "pandas==3.0.5",
    "photutils==3.0.0",
    "pillow==12.3.0",
    "psrqpy==1.3.2",
    "pycparser==3.0",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pyerfa==2.0.1.5",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "pyvo==1.9.1",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "scipy==1.18.0",
    "SecretStorage==3.5.0",
    "sep==1.4.1",
    "six==1.17.0",
    "sniffio==1.3.1",
    "soupsieve==2.9.2",
    "typing-inspection==0.4.2",
    "typing-extensions==4.16.0",
    "urllib3==2.7.0",
    "webencodings==0.5.1",
    "Werkzeug==3.1.8",
]

[project.scripts]
kepler-database-tool = "database_tools:main"

[tool.setuptools]
py-modules = ["database_tools"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["tools*", "algorithms*"]

[tool.setuptools.package-data]
"algorithms.skylib_lite.astrometry.anet" = ["ngc2000.dat"]
