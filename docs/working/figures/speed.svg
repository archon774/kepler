<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 293" width="720" height="293" role="img" aria-labelledby="t d" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Seconds to a correct answer</title><desc id="d">First attempt at each task. Lower is better. A repeat of the same task reuses the provider's prefix cache, so only first attempts are counted. Hosted API against a local daemon: this measures where a model runs as much as the model.</desc><rect width="720" height="293" fill="#fcfcfb"/><text x="20" y="30" font-size="15" font-weight="700" fill="#0b0b0b">Seconds to a correct answer</text><text x="20" y="50" font-size="12" fill="#52514e">First attempt at each task. Lower is better.</text><text x="178" y="102" font-size="12" text-anchor="end" fill="#0b0b0b">qwen3.5:9b</text><rect x="190" y="84" width="111.7" height="26" rx="4" fill="#1baf7a"><title>qwen3.5:9b: 36s</title></rect><text x="310.7" y="102" font-size="12" font-weight="600" fill="#0b0b0b">36s</text><text x="178" y="148" font-size="12" text-anchor="end" fill="#0b0b0b">claude-sonnet-5</text><rect x="190" y="130" width="125.6" height="26" rx="4" fill="#2a78d6"><title>claude-sonnet-5: 40s</title></rect><text x="324.6" y="148" font-size="12" font-weight="600" fill="#0b0b0b">40s</text><text x="324.6" y="163" font-size="10.5" fill="#8a8984">1.1x the best</text><text x="178" y="194" font-size="12" text-anchor="end" fill="#0b0b0b">qwen3.8:27b-mlx</text><rect x="190" y="176" width="400.0" height="26" rx="4" fill="#eb6834"><title>qwen3.8:27b-mlx: 128s</title></rect><text x="599.0" y="194" font-size="12" font-weight="600" fill="#0b0b0b">128s</text><text x="599.0" y="209" font-size="10.5" fill="#8a8984">3.6x the best</text><text x="20" y="242" font-size="11" fill="#8a8984">A repeat of the same task reuses the provider's prefix cache, so only first attempts are</text><text x="20" y="257" font-size="11" fill="#8a8984">counted. Hosted API against a local daemon: this measures where a model runs as much as the</text><text x="20" y="272" font-size="11" fill="#8a8984">model.</text></svg>