<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 263" width="720" height="263" role="img" aria-labelledby="t d" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Tokens to a correct answer</title><desc id="d">Input plus output, on sessions that reached a passing answer. Lower is better. Tokens spent on sessions that never reached an answer are excluded here and reported separately.</desc><rect width="720" height="263" fill="#fcfcfb"/><text x="20" y="30" font-size="15" font-weight="700" fill="#0b0b0b">Tokens to a correct answer</text><text x="20" y="50" font-size="12" fill="#52514e">Input plus output, on sessions that reached a passing answer. Lower is better.</text><text x="178" y="102" font-size="12" text-anchor="end" fill="#0b0b0b">qwen3.5:9b</text><rect x="190" y="84" width="161.5" height="26" rx="4" fill="#1baf7a"><title>qwen3.5:9b: 63,882</title></rect><text x="360.5" y="102" font-size="12" font-weight="600" fill="#0b0b0b">63,882</text><text x="178" y="148" font-size="12" text-anchor="end" fill="#0b0b0b">qwen3.8:27b-mlx</text><rect x="190" y="130" width="226.1" height="26" rx="4" fill="#eb6834"><title>qwen3.8:27b-mlx: 89,426</title></rect><text x="425.1" y="148" font-size="12" font-weight="600" fill="#0b0b0b">89,426</text><text x="425.1" y="163" font-size="10.5" fill="#8a8984">1.4x the best</text><text x="178" y="194" font-size="12" text-anchor="end" fill="#0b0b0b">claude-sonnet-5</text><rect x="190" y="176" width="400.0" height="26" rx="4" fill="#2a78d6"><title>claude-sonnet-5: 158,182</title></rect><text x="599.0" y="194" font-size="12" font-weight="600" fill="#0b0b0b">158,182</text><text x="599.0" y="209" font-size="10.5" fill="#8a8984">2.5x the best</text><text x="20" y="242" font-size="11" fill="#8a8984">Tokens spent on sessions that never reached an answer are excluded here and reported separately.</text></svg>