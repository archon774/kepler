<svg xmlns="http://www.w3.org/2000/svg" width="900" height="548" viewBox="0 0 900 548" role="img" aria-label="Five layers: two harnesses -- the kepler console and kepler-bench -- drive run_session, which branches left into the model port and its four adapters and right into the tool registry, the tool modules and the algorithms. The right branch runs with no model, no key and no socket. The adapters never import the registry.">
  <title>Five layers: two harnesses -- the kepler console and kepler-bench -- drive run_session, which branches left into the model port and its four adapters and right into the tool registry, the tool modules and the algorithms. The right branch runs with no model, no key and no socket. The adapters never import the registry.</title>
  <style>
