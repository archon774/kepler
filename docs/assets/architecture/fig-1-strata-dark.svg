  .tm { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 500; }
  .tl { font-size: 10px; font-weight: 600; letter-spacing: .1em; fill: #7E9097; }
  .tla { font-size: 10px; font-weight: 600; letter-spacing: .1em; fill: #4FBECA; }
  .tlw { font-size: 10px; font-weight: 600; letter-spacing: .1em; fill: #DE9A52; }
