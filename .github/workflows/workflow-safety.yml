name: Workflow safety

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: workflow-safety-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflow syntax and shell snippets
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:latest -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Audit workflow security posture
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1 --min-severity medium --min-confidence medium .github/workflows

  required:
    name: "required: workflow safety"
    runs-on: ubuntu-latest
    if: always()
    needs: [actionlint, zizmor]
    steps:
      - name: Fail unless every workflow-safety job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result != "success")' >/dev/null; then
            echo "::error::a workflow-safety job failed, was cancelled, or was skipped"
            exit 1
          fi
          echo "all workflow-safety jobs succeeded"
