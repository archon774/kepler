name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-syntax:
    name: python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile Python files
        run: python -m compileall -q tools algorithms tests

  python-tests:
    name: python tests
    runs-on: ubuntu-latest
    steps:
      # lfs: true only here. The three NGC 5286 B frames are Git LFS objects
      # and the field-calibration tests that drive them from pixels skip
      # themselves without the content -- which would let a regression pass CI
      # silently. The other two jobs read no pixels, so they keep the cheaper
      # pointer-only checkout.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Run pytest
        env:
          MPLBACKEND: Agg
        run: uv run --locked pytest

  repository-shape:
    name: repository shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check required project files
        run: |
          test -f README.md
          test -f pyproject.toml
          test -f uv.lock
          test -f docs/tool-architecture.md
          test -f tools/registry.py
          test -f tools/agent/engine.py
          test -f tools/tui/app.py

  required:
    name: "required: ci"
    runs-on: ubuntu-latest
    if: always()
    needs: [python-syntax, python-tests, repository-shape]
    steps:
      - name: Fail unless every required CI job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result != "success")' >/dev/null; then
            echo "::error::a required CI job failed, was cancelled, or was skipped"
            exit 1
          fi
          echo "all required CI jobs succeeded"
