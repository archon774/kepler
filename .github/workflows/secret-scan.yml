name: Secret scan

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the working tree
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            zricethezav/gitleaks:latest dir /repo \
            --config /repo/.gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1

      - name: Scan the commit history
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            zricethezav/gitleaks:latest git /repo \
            --config /repo/.gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1
