tool: search_simbad_measurements
recorded_on: 2026-09-14
provenance: >
  HAND-AUTHORED, not captured. Written against tools/simbad.py's return
  model. It exists so the replayed archive is not EMPTY: a live run showed a
  model making 38 calls across 12 tools and never answering, because every
  undeclared tool returned nothing and it kept trying further archives. An
  empty world punishes a model for cross-checking sources, which is
  behaviour the real surface rewards. The SHAPE is faithful to the tool; the
  VALUES are plausible placeholders and must not be quoted as measurements.
  Replace with a `kepler-bench record` capture when credentials allow.
miss_policy: synthesize
entries:
  - id: cassiopeia-a
    match: {name: {contains: "cas"}}
    response:
      status: ok
      count: 12
      columns: [filter, flux, flux_error, bibcode]
      preview:
        - {filter: "R", flux: 2050.0, flux_error: 100.0, bibcode: "1977A&AS...28..211B"}
      artifact: {format: ecsv, row_count: 12, columns: [filter, flux, flux_error, bibcode]}
  - id: default
    match: {}
    response: {status: not_found, count: 0}
