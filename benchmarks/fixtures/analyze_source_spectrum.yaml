tool: analyze_source_spectrum
recorded_on: 2026-09-14
provenance: >
  HAND-AUTHORED, not captured. Written against tools/radio_sources.py's
  return model. It exists so the replayed archive is not EMPTY: a live run
  showed a model making 38 calls across 12 tools and never answering,
  because every undeclared tool returned nothing and it kept trying further
  archives. An empty world punishes a model for cross-checking sources,
  which is behaviour the real surface rewards. The SHAPE is faithful to the
  tool; the VALUES are plausible placeholders and must not be quoted as
  measurements. Replace with a `kepler-bench record` capture when
  credentials allow.
miss_policy: synthesize
entries:
  - id: cassiopeia-a
    match: {name: {contains: "cas"}}
    response:
      status: ok
      count: 1
      columns: [spectral_index, spectral_index_error, n_points]
      preview:
        - {spectral_index: -0.77, spectral_index_error: 0.03, n_points: 12}
      warnings:
        - >-
          spectral_index follows S_nu ~ nu**alpha. A bare number without that
          convention is meaningless out of context.
      artifact: {format: ecsv, row_count: 12, columns: [frequency_ghz, flux_jy]}
  - id: default
    match: {}
    response: {status: not_found, count: 0}
