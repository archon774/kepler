id: atnf-formal-designation
title: ATNF does zero name resolution
tags: [core, fidelity, name-resolution, atnf]
prompt: >
  Look up the Crab pulsar's parameters in the ATNF catalogue.

# Every recorded fixture. A model that cross-checks an adjacent archive
# gets a recorded answer rather than silence -- see FIXTURES_ALL in
# tools/bench/tasks.py for the run that made the alternative concrete.
fixtures: all
# An off-script call must not derail the run. benchmark.md 5.3 provides for
# exactly this: `synthesize` hands back a schema-valid empty result -- which is
# what a real archive returns for no match -- instead of a fixture_miss error.
#
# A live run made the cost concrete. One model explored 13 distinct tools
# on one task; 15 of its 22 calls hit undeclared fixtures, every one came back
# an error, and it exhausted its turns. That measured this suite's fixture
# coverage, not the model. The miss *rate* is still counted and printed in the
# report header, so the coverage gap stays visible -- it just no longer ends
# the session.
#
# No key here grades a fixture miss, and the deliberate failures are matched
# entries rather than misses, so this weakens nothing: the colloquial-name
# error in search_ned.yaml still fires.
miss_policy: synthesize

expect:
  trajectory:
    must_call: [search_atnf]
    arguments:
      - tool: search_atnf
        quantifier: all
        where:
          name: {one_of: ["J0534+2200", "B0531+21"]}
        because: >
          ATNF does zero name resolution: "Crab" matches nothing and returns an
          empty result rather than an error, so a model that passes it reports
          "the Crab is not in the catalogue" about the most famous pulsar
          there is. The designation must be translated before the call.
  answer:
    # Added after a live run: the key was trajectory-only and so passed the
    # headline axis vacuously. This states the consequence of the trajectory
    # rule directly -- an empty ATNF result reported as an absent pulsar is
    # the failure, and it is checkable on the answer alone.
    must_not_match:
      - "not (?:in|listed in|found in|catalogued in) (?:the )?ATNF"
      - "no (?:match|entry|record|results?) for the Crab"
      - "(?:Crab|J0534\\+2200|B0531\\+21)[^.]{0,60}(?:is not|isn't) (?:in|listed|catalogued)"
