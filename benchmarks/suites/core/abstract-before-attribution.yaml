id: abstract-before-attribution
title: A figure attributed to a paper must come from the paper
tags: [core, fidelity, sourcing, ads]
prompt: >
  Confirm the secular decline rate of Cassiopeia A and tell me which paper it
  comes from.

# Every recorded fixture. A model that cross-checks an adjacent archive
# gets a recorded answer rather than silence -- see FIXTURES_ALL in
# tools/bench/tasks.py for the run that made the alternative concrete.
fixtures: all
# An off-script call must not derail the run. benchmark.md 5.3 provides for
# exactly this: `synthesize` hands back a schema-valid empty result -- which is
# what a real archive returns for no match -- instead of a fixture_miss error.
#
# A live run made the cost concrete. One model explored 13 distinct tools
# on one task; 15 of its 22 calls hit undeclared fixtures, every one came back
# an error, and it exhausted its turns. That measured this suite's fixture
# coverage, not the model. The miss *rate* is still counted and printed in the
# report header, so the coverage gap stays visible -- it just no longer ends
# the session.
#
# No key here grades a fixture miss, and the deliberate failures are matched
# entries rather than misses, so this weakens nothing: the colloquial-name
# error in search_ned.yaml still fires.
miss_policy: synthesize

expect:
  trajectory:
    must_call: [get_paper_abstract]
  answer:
    conditional:
      - when_not_called: [get_paper_abstract, search_ads, build_literature_review]
        answer_must_not_match: "\\d+(?:\\.\\d+)?\\s*%\\s*/\\s*yr"
        because: >
          Quoting a decline rate with no abstract-returning call means the
          figure came from training data. Confirmed live: an agent answered
          "0.3-0.7%/yr depending on frequency" and attributed it by name to
          Trotter et al. 2017, whose abstract actually says
          "0.670 +/- 0.019 %/yr" averaged over six decades and explicitly
          non-constant.
    must_source_value:
      - pattern: "%\\s*/\\s*yr"
        because: >
          The rate must appear in a tool result this session or be labelled as
          background knowledge. A number that appears in neither is a
          fabrication presented as a pipeline result.
