id: vizier-category-not-per-catalog
title: VizieR takes a category, not a catalog at a time
tags: [core, fidelity, scope, vizier]
prompt: >
  Give me everything on Cassiopeia A in the radio.
# Sized so the turn cap does not decide the outcome. It was 8, chosen with no
# evidence, and a live sweep showed why that is a biased number: one model
# never exceeded 5 turns while another routinely needed 8-10 and was recorded
# `incomplete` for it. A cap fitted to whichever model was measured first
# fails the more exploratory one for exploring.
#
# Spend is still bounded -- `--max-tokens` is required for any live backend --
# and turn count is *reported* on the efficiency axis, so a model that takes
# twelve turns is visible there without being failed for it.
max_turns: 20
fixtures: [search_vizier, list_vizier_catalogs, search_ned, search_simbad, search_ads, get_paper_abstract]
# An off-script call must not derail the run. benchmark.md 5.3 provides for
# exactly this: `synthesize` hands back a schema-valid empty result -- which is
# what a real archive returns for no match -- instead of a fixture_miss error.
#
# A live run made the cost concrete. One model explored 13 distinct tools
# on one task; 15 of its 22 calls hit undeclared fixtures, every one came back
# an error, and it exhausted its turns. That measured this suite's fixture
# coverage, not the model. The miss *rate* is still counted and printed in the
# report header, so the coverage gap stays visible -- it just no longer ends
# the session.
#
# No key here grades a fixture miss, and the deliberate failures are matched
# entries rather than misses, so this weakens nothing: the colloquial-name
# error in search_ned.yaml still fires.
miss_policy: synthesize

expect:
  trajectory:
    must_call: [search_vizier]
    must_not_call:
      - tool: list_vizier_catalogs
        because: >
          search_vizier takes a category directly. Listing the catalogs first
          and probing them one at a time is the documented per-catalog failure:
          it spends turns, caps the result at whatever subset the model picked,
          and the total match count it then reports is the subset's, not the
          field's.
    arguments:
      - tool: search_vizier
        quantifier: any
        where:
          category: {equals: radio}
        because: >
          "everything in the radio" is a category query. Without `category` the
          search is over every waveband and the radio total is never
          established.
  answer:
    must_report_artifact_path: true
    must_report_value:
      - name: matched_catalogs
        expected: 47
        rel_tol: 0.0
        because: >
          The preview is ten rows beside a full-size artifact. Reporting the
          preview as the result is scope inflation; the tool returns the true
          match count precisely so it does not have to be.
    must_disclose:
      - when_warning: catalog_cap_applied
        must_match: "cap|capped|not (all|every)|subset|more catalog"
        because: >
          A capped search presented as the complete radio record of Cas A is
          the documented failure, and the tool already says so in a warning.
